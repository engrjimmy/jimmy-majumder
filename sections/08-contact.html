<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-alt: #0a0e1a; --text: #e9edf7; --text-dim: #9aa4bd; --accent: #5eead4; --border: #232a3d;
  --gradient: linear-gradient(120deg, #5eead4 0%, #818cf8 50%, #f472b6 100%);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg-alt); color: var(--text); font-family: 'Inter', sans-serif; line-height: 1.6; }
h2 { font-family: 'Sora', sans-serif; letter-spacing: -0.02em; margin: 0; }
p { margin: 0 0 1rem; color: var(--text-dim); }
a { color: inherit; text-decoration: none; }
.container { max-width: 700px; margin: 0 auto; padding: 0 24px; text-align: center; display: flex; flex-direction: column; align-items: center; }
.reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s ease, transform 0.7s ease; }
.reveal.is-visible { opacity: 1; transform: translateY(0); }
.section { padding: 80px 0; }
.section-tag { font-size: 0.85rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
.section-title { font-size: clamp(1.7rem, 3.4vw, 2.3rem); font-weight: 800; margin-bottom: 20px; }
.contact-lede { max-width: 560px; font-size: 1.02rem; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 13px 26px; border-radius: 999px; font-weight: 600; font-size: 0.95rem; border: 1px solid transparent; cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; }
.btn:hover { transform: translateY(-2px); }
.btn-primary { background: var(--gradient); color: #06080f; box-shadow: 0 10px 30px -8px rgba(94,234,212,0.4); }
.contact-actions { margin: 8px 0 28px; }
.contact-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 26px; }
.contact-links a { font-size: 0.9rem; color: var(--text-dim); border-bottom: 1px solid transparent; transition: color 0.2s ease, border-color 0.2s ease; }
.contact-links a:hover { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<section class="section">
  <div class="container">
    <p class="section-tag reveal">Get in Touch</p>
    <h2 class="section-title reveal">Let's build something ambitious together.</h2>
    <p class="reveal contact-lede">
      Open for consultation, collaboration, and innovative robotics solutions — in AI-driven
      automation, autonomous systems, and advanced robotics technologies.
    </p>
    <div class="contact-actions reveal">
      <a href="mailto:eng.jimmy.majumder@gmail.com" class="btn btn-primary">eng.jimmy.majumder@gmail.com</a>
    </div>
    <div class="contact-links reveal">
      <a href="https://barrc-bd.com/" target="_blank" rel="noopener">BARRC Website</a>
      <a href="https://www.slideshare.net/jimmymajumder1/curriculum-vitae-of-jimmy-majumder/jimmymajumder1/curriculum-vitae-of-jimmy-majumder" target="_blank" rel="noopener">CV / Resume</a>
      <a href="https://www.slideshare.net/jimmymajumder1/engineering-project-profile" target="_blank" rel="noopener">Project Portfolio</a>
    </div>
  </div>
</section>
<script>
const revealEls = document.querySelectorAll('.reveal');
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) { entry.target.classList.add('is-visible'); revealObserver.unobserve(entry.target); }
  });
}, { threshold: 0.15 });
revealEls.forEach(el => revealObserver.observe(el));
</script>
</body>
</html>
