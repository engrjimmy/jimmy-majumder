<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e1a; --text: #e9edf7; --text-faint: #6b7590; --accent: #5eead4; --border: #232a3d;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
.container { max-width: 900px; margin: 0 auto; padding: 0 24px; }
.reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s ease, transform 0.7s ease; }
.reveal.is-visible { opacity: 1; transform: translateY(0); }
.stats-strip { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 40px 0; }
.stats-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 20px; text-align: center; }
.stat { display: flex; flex-direction: column; align-items: center; }
.stat-num { font-family: 'Sora', sans-serif; font-size: 2.2rem; font-weight: 800; color: var(--text); }
.stat-suffix { font-size: 1.1rem; font-weight: 700; color: var(--accent); margin-left: 2px; }
.stat p { margin: 6px 0 0; font-size: 0.82rem; color: var(--text-faint); }
@media (max-width: 720px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<section class="stats-strip">
  <div class="container stats-grid">
    <div class="stat reveal"><span class="stat-num" data-count="8">0</span><span class="stat-suffix">+</span><p>Years Experience</p></div>
    <div class="stat reveal"><span class="stat-num" data-count="45">0</span><span class="stat-suffix">+</span><p>Robotics &amp; Autonomous Projects</p></div>
    <div class="stat reveal"><span class="stat-num" data-count="25">0</span><span class="stat-suffix">+</span><p>Honors &amp; Awards</p></div>
    <div class="stat reveal"><span class="stat-num" data-count="10">0</span><span class="stat-suffix">K+</span><p>Students Trained</p></div>
    <div class="stat reveal"><span class="stat-num" data-count="5">0</span><span class="stat-suffix">K+</span><p>Community Members Led</p></div>
    <div class="stat reveal"><span class="stat-num" data-count="35">0</span><span class="stat-suffix">+</span><p>Media Features</p></div>
  </div>
</section>
<script>
const revealEls = document.querySelectorAll('.reveal');
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) { entry.target.classList.add('is-visible'); revealObserver.unobserve(entry.target); }
  });
}, { threshold: 0.15 });
revealEls.forEach(el => revealObserver.observe(el));

const statNums = document.querySelectorAll('.stat-num');
const statObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) { animateCount(entry.target); statObserver.unobserve(entry.target); }
  });
}, { threshold: 0.4 });
statNums.forEach(el => statObserver.observe(el));

function animateCount(el) {
  const target = parseInt(el.getAttribute('data-count'), 10);
  const duration = 1200;
  const start = performance.now();
  function step(now) {
    const progress = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    el.textContent = Math.round(eased * target);
    if (progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
</script>
</body>
</html>
